# Сгенерировано ai/gen/gen.py из ai/mcp-servers.toml — не править руками (AI-CTX-3).
# Патч DeepSeek Harness: серверы MCP (stdio), `dsh --patch <файл>`.
- insert:
    - id: mcp-lsp-python
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: lsp-python
        transport: stdio
        command: "code-context-lsp"
        args: ["python"]
        cwd: !!js process.cwd()
    - id: mcp-lsp-cpp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: lsp-cpp
        transport: stdio
        command: "code-context-lsp"
        args: ["cpp"]
        cwd: !!js process.cwd()
    - id: mcp-lsp-rust
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: lsp-rust
        transport: stdio
        command: "code-context-lsp"
        args: ["rust"]
        cwd: !!js process.cwd()
    - id: mcp-playwright
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: playwright
        transport: stdio
        command: "playwright-mcp"
        args: []
        cwd: !!js process.cwd()
