# Корни проектов с исключениями из облака (AI-SBX-5, AI-SEC-6, ADR-47).
# Читает agent-launcher (~/.config/ai/roots.toml). По умолчанию облако разрешено:
# сюда вносятся только проекты, где работодатель или заказчик запрещает отправку кода
# провайдерам (AI-SEC-9) — внести ДО начала работы с проектом. Проект под таким корнем
# запускается в `offline` (шлюз, DNS и сети VPN; остальное закрыто), агент по подписке
# в нём не стартует. На один запуск то же даёт `agent-launcher <агент> --offline`.
# Невалидный файл — отказ запуска, а не молчаливый `online`.
#
# [[root]]
# path  = "~/work/employer"   # `~` — домашний каталог; корень включает вложенные каталоги
# cloud = "deny"
