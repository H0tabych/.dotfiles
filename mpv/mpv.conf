# Портативный конфиг mpv (DOT-3). Без констант хоста.

vo=gpu
# Декодирование — принудительно на встроенной GPU (APP-3, ROADMAP R7.2):
# /dev/dri/by-host/igpu-render — ролевая ссылка udev-правила фичи gpu-hybrid
# (nixos-config, DESK-5), не адрес конкретного хоста, поэтому её можно задать
# здесь, а не в machine.d (DOT-3). Render-нода, не card: ПРОВЕРЕНО на машине —
# автоопределение драйвера libva (vaGetDriverNames) падает на card-ноде и mpv
# молча уходит на программный декодер; на render-ноде определяется верно.
hwdec=vaapi
vaapi-device=/dev/dri/by-host/igpu-render
gpu-context=wayland

include=~~/theme.conf

save-position-on-quit
screenshot-format=png
screenshot-directory=~/Pictures/mpv-screenshots

osd-font-size=28
sub-auto=fuzzy
volume-max=150
