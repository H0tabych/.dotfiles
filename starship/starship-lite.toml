# Сгенерировано theme/gen/gen.py из theme/palette.toml (вариант forest, профиль ac) — не редактируйте
"$schema" = "https://starship.rs/config-schema.json"
add_newline = false
palette = "glass_tide"
format = "$directory$git_branch$git_state$character"
right_format = "$cmd_duration$status$nix_shell$python"
command_timeout = 50
scan_timeout = 10

[palettes.glass_tide]
text = "#DCE7EC"
subtext0 = "#A6B7BF"
accent_warm = "#F2A988"
special = "#B49AE8"
info = "#91A4ED"
warning = "#F0B86E"
error = "#F0817F"
success = "#B5DB86"

[directory]
format = "[$path]($style)[$read_only]($read_only_style) "
style = "fg:text bold"
read_only = " ro"
read_only_style = "fg:error"
truncation_length = 3
truncate_to_repo = true

[git_branch]
format = "on [$branch]($style) "
style = "fg:accent_warm"

[git_state]
format = "[$state( $progress_current/$progress_total)]($style) "
style = "fg:warning"

[git_status]
use_git_executable = true
format = "([$all_status$ahead_behind]($style) )"
style = "fg:subtext0"
disabled = true

[character]
success_symbol = "[❯](bold fg:success)"
error_symbol = "[❯](bold fg:error)"

[cmd_duration]
min_time = 2000
format = "[$duration]($style) "
style = "fg:special"

[status]
disabled = false
format = "[$status]($style) "
style = "fg:error"

[nix_shell]
format = "[nix:$state]($style) "
style = "fg:info"

[python]
format = "[(venv:$virtualenv)]($style) "
style = "fg:info"
detect_extensions = []
detect_files = []
detect_folders = []
