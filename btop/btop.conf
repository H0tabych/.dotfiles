#? Config file for btop++ (DOT-3). Статика — не из генератора: указывает
#? только на сгенерированный файл темы (theme/gen/gen.py, PLAIN_DEST), сам
#? не содержит токенов палитры. Формат и ключи сверены живьём:
#? `btop --default-config` (btop 1.4.7, nixpkgs).
#? ПРОВЕРЕНО: при первом живом запуске btop сам дописывает в этот файл
#? остальные ключи с их умолчаниями (штатное поведение btop, не ошибка) —
#? здесь намеренно оставлены только два, которые задаёт сама фича.

#* Name of a btop++/bpytop/bashtop formatted ".theme" file, "Default" and "TTY" for builtin themes.
#* Themes should be placed in "../share/btop/themes" relative to binary or "$HOME/.config/btop/themes"
color_theme = "glass-tide"

#* If the theme set background should be shown, set to False if you want terminal background transparency.
theme_background = false
