# hyprpaper 0.8.4 (P.3.4, DOT-3): статический файл — обои не зависят от палитры/
# профиля (L6, раздел 2.1), генератору это переносить незачем. $wallpaper —
# из machine.d (dotfiles-link.nix, DOT-5): абсолютный путь зависит от
# dotfiles.source, hyprlang не резолвит $HOME сам (проверено на машине, R6.8).
#
# Синтаксис — блок `wallpaper { … }`, а не `preload=`/`wallpaper=mon,path`
# (устаревший синтаксис из большинства гайдов в сети): в 0.8.4 hyprpaper
# переписан на Hyprtoolkit, ключа preload в бинаре нет вовсе, wallpaper —
# "special category" hyprlang. Сверено по исходнику 0.8.4
# (src/config/ConfigManager.cpp, addSpecialCategory("wallpaper", …)) и
# проверено запуском на машине 2026-10-15. monitor = "*" — подстановка "все
# мониторы" (пустая строка ненадёжна — WallpaperMatcher.cpp, комментарий
# isWildcard).
source = ~/.config/machine.d/hypr-wallpaper.conf

wallpaper {
    monitor = *
    path = $wallpaper
    fit_mode = cover
}
