# Сгенерировано theme/gen/gen.py из theme/palette.toml (вариант forest, профиль ac) — не редактируйте
# source = ~/.config/hypr/theme.conf (P.3.4): роли цвета и шрифт для hyprlock
# (hyprlang). Не зависит от профиля — L6 не тонируется (раздел 2.1).
# string.Template (gen.py) использует знак доллара для своих плейсхолдеров
# (двойной — литерал), поэтому имена переменных hyprlang ниже экранированы.
#
# $wallpaper здесь не определяется: ПРОВЕРЕНО на машине 2026-10-15 (R6.8,
# исправление) — hyprlang НЕ резолвит необъявленную переменную как переменную
# окружения (hyprpaper тихо не находил цель: журнал "no wp will be created").
# Абсолютный путь собирает Nix (machine.d/hypr-wallpaper.conf, dotfiles-link.nix)
# из my.users.<user>.dotfiles.source — это факт установки, не дизайна.
$accent = rgba(6CC6DDFF)
$text = rgba(DCE7ECFF)
$error = rgba(F0817FFF)
$glass_popup = rgba(0A141BE6)
$font_ui = Inter
