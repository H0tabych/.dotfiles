# Портативная часть конфига Hyprland (DOT-3: содержимое приложения — dotfiles,
# пакет/юнит/сессия — Nix). Монитор-специфичные строки — в machine.d (DOT-5).

source = colors.conf
source = ~/.config/machine.d/hypr-monitors.conf

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = $accent
    col.inactive_border = $inactive
    layout = dwindle
}

decoration {
    rounding = 6
    blur {
        enabled = true
        size = 4
        passes = 2
    }
}

animations {
    enabled = true
}

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
}

misc {
    disable_hyprland_logo = true
}

# Базовые бинды — расширяйте по вкусу
bind = SUPER, Return, exec, foot
bind = SUPER, Q, killactive,
bind = SUPER, M, exit,
bind = SUPER, Space, exec, rofi -show drun
bind = SUPER, V, togglefloating,
bind = SUPER, F, fullscreen,

bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4

bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow
