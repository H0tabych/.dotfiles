# hyprlock 0.9 (DSN-S5, R6.8). Ключи проверены по исходникам 0.9.5
# (DESIGN_SYSTEM.md I.6): background (path, blur_passes, blur_size,
# brightness), input-field (size, rounding, outline_thickness, outer_color,
# inner_color, font_color, check_color, fail_color, placeholder_text,
# font_family), label (text, font_size, color, font_family). L6 не тонируется
# по профилю (раздел 2.1) — source = theme.conf один на все профили.
source = ~/.config/hypr/theme.conf

background {
    path = $wallpaper
    blur_passes = 3
    blur_size = 7
    brightness = 0.7
}

# DSN-LAY-12: часы, дата, поле ввода (L3), раскладка, заряд батареи;
# содержимое окон не показывается.
label {
    text = $TIME
    font_size = 72
    color = $text
    font_family = $font_ui
    halign = center
    valign = center
    position = 0, 120
}

label {
    text = cmd[update:60000] date +"%A, %d %B"
    font_size = 20
    color = $text
    font_family = $font_ui
    halign = center
    valign = center
    position = 0, 40
}

label {
    text = $LAYOUT
    font_size = 16
    color = $accent
    font_family = $font_ui
    halign = center
    valign = center
    position = 0, -60
}

label {
    text = cmd[update:30000] cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -1
    font_size = 16
    color = $text
    font_family = $font_ui
    halign = center
    valign = center
    position = 0, -90
}

input-field {
    size = 320, 52
    rounding = 12
    outline_thickness = 2
    outer_color = $accent
    inner_color = $glass_popup
    font_color = $text
    check_color = $accent
    fail_color = $error
    placeholder_text = Пароль…
    font_family = $font_ui
    halign = center
    valign = center
    position = 0, -20
}
