# hyprlock 0.9 (DSN-S5, R6.8). Ключи проверены по исходникам 0.9.5
# (DESIGN_SYSTEM.md I.6): background (path, blur_passes, blur_size,
# brightness), input-field (size, rounding, outline_thickness, outer_color,
# inner_color, font_color, check_color, fail_color, placeholder_text,
# font_family), label (text, font_size, color, font_family). L6 не тонируется
# по профилю (раздел 2.1) — source = theme.conf один на все профили.
# $wallpaper — из machine.d (dotfiles-link.nix, DOT-5): абсолютный путь зависит
# от dotfiles.source, hyprlang не резолвит $HOME сам (проверено на машине, R6.8).
source = ~/.config/hypr/theme.conf
source = ~/.config/machine.d/hypr-wallpaper.conf

background {
    path = $wallpaper
    blur_passes = 3
    blur_size = 7
    brightness = 0.7
}

# Подложка под текст (R9.9, DSN-COL-4): без неё текст лежал прямо на размытых обоях, и на
# ярком месте (закат у `forest`) контраст падал до 1,2–3,1:1 при норме 7:1. Подложка — тот же
# `glass_popup` (L3), что и у поля ввода: контраст текста от обоев больше не зависит.
# Рисуется первой — виджеты идут в порядке объявления.
shape {
    size = 360, 320
    color = $glass_popup
    rounding = 12
    border_size = 0
    halign = center
    valign = center
    position = 0, 30
}

# DSN-LAY-12: часы, дата, поле ввода (L3), раскладка, заряд батареи;
# содержимое окон не показывается.
label {
    text = $TIME
    font_size = 72
    color = $text
    font_family = $font_ui
    halign = center
    valign = center
    position = 0, 120
}

label {
    text = cmd[update:60000] date +"%A, %d %B"
    font_size = 20
    color = $text
    font_family = $font_ui
    halign = center
    valign = center
    position = 0, 40
}

label {
    text = $LAYOUT
    font_size = 16
    color = $accent
    font_family = $font_ui
    halign = center
    valign = center
    position = 0, -60
}

label {
    # Заряд с единицами (DSN-LAY-12, DSN-P-6: голое число читалось неоднозначно); на ПК без
    # батареи — пусто. Без shell-переменных: hyprlang подставляет свои `$имя` и в cmd[].
    text = cmd[update:30000] cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -1 | sed 's/.*/Заряд & %/'
    font_size = 16
    color = $text
    font_family = $font_ui
    halign = center
    valign = center
    position = 0, -90
}

input-field {
    size = 320, 52
    rounding = 12
    outline_thickness = 2
    outer_color = $accent
    inner_color = $glass_popup
    font_color = $text
    check_color = $accent
    fail_color = $error
    placeholder_text = Пароль…
    font_family = $font_ui
    halign = center
    valign = center
    position = 0, -20
}
