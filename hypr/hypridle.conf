# Портативный конфиг hypridle (DOT-3). Минимальный стартовый набор, без личных
# привычек (как остальные стартовые конфиги R4.1) — донастройка показателей времени
# не входит в этот шаг.

general {
    lock_cmd = hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
