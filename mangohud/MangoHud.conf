# Портативный конфиг MangoHud (DOT-3). Целевой путь — ~/.config/MangoHud/MangoHud.conf
# (нестандартное именование каталога, см. REGISTRY.md). Без привязки к конкретной шине GPU —
# автоопределение MangoHud.

fps
frametime
cpu_temp
gpu_temp
ram
vram
position=top-left
font_size=18
background_alpha=0.4
no_display=0
toggle_hud=Shift_R+F12
