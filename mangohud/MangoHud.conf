# Сгенерировано theme/gen/gen.py из theme/palette.toml (вариант forest, профиль ac) — не редактируйте
# ~/.config/MangoHud/MangoHud.conf (DSN-CMP-20): оверлей всегда сплошной
# (DSN-EXC-2) — фон base с альфой 0.6, текст text, скругление — токен
# shape.radius.control (совпадает с DSN-CMP-20: 8). Шрифт — встроенный
# MangoHud: кастомный шрифт принимает только абсолютный путь к .ttf
# (font_file), а dotfiles не хранят пути /nix/store (переносимость, DOT-8) —
# осознанное отступление от «шрифт моно» DSN-CMP-20, не забытый пункт.
fps
frametime
cpu_temp
gpu_temp
ram
vram
position=top-left
font_size=10
background_color=0E1A22
background_alpha=0.6
round_corners=8
text_color=DCE7EC
no_display=0
toggle_hud=Shift_R+F12
