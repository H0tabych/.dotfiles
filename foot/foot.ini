# Портативный конфиг foot (DOT-3).
include=~/.config/foot/colors.ini

[main]
dpi-aware=yes

[scrollback]
lines=10000

[cursor]
style=beam
blink=yes

[mouse]
hide-when-typing=no

[tweak]
# ADR-38 (R6.9, nixos-config): промпт starship больше не использует
# powerline-разделители Nerd Font (без пробела после них вылезающий хвостик
# глифа, ~5.5% ширины ячейки, закрашивал первую/последнюю букву соседнего
# текста — ПРОВЕРЕНО на машине). Запас оставлен ради иконок файлов yazi —
# тот же риск наложения, если имя файла идёт впритык без пробела. По
# умолчанию foot — "yes".
overflowing-glyphs=no
