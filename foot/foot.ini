# Портативный конфиг foot (DOT-3).
include=~/.config/foot/colors.ini

[main]
dpi-aware=yes

[scrollback]
lines=10000

[cursor]
style=beam
blink=yes

[mouse]
hide-when-typing=no

[tweak]
# yazi: подсветка текущей строки (скруглённый "пилюля"-фон, встроенный
# рендер yazi) рисовала тёмный полукруг поверх значка — ПРОВЕРЕНО на
# машине (R6.9): тот же класс бага, что и у разделителей starship (ADR-38),
# глиф вылезает за границу своей ячейки. Компромисс: некоторые иконки файлов
# могут быть чуть обрезаны справа — это лучше, чем полукруг на каждой
# выделенной строке. По умолчанию foot — "yes".
overflowing-glyphs=no
