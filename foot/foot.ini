# Портативный конфиг foot (DOT-3).
include=~/.config/foot/colors.ini

[main]
font=JetBrains Mono:size=11, Symbols Nerd Font Mono:size=11
pad=16x12 center
dpi-aware=yes

[scrollback]
lines=10000

[cursor]
style=beam
blink=yes

[mouse]
hide-when-typing=no

[tweak]
# Без пробела после разделителя (starship, powerline) вылезающий хвостик
# глифа ([]/[], ~5.5% ширины ячейки) закрашивал первую/последнюю
# букву соседнего текста — ПРОВЕРЕНО на машине (R6.9). По умолчанию "yes".
overflowing-glyphs=no
