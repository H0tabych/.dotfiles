name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # DSN-S5 (R6.8): скрипты оболочки (waybar/scripts/*, rofi/scripts/*) без
      # расширения .sh (имена — по DESIGN_SYSTEM.md P.3.2/P.3.3), поэтому ищем
      # и по пути, не только по расширению.
      - name: shellcheck
        run: |
          for f in $(find . \( -name '*.sh' -o -path '*/scripts/*' \) -type f -not -path './.git/*'); do
            shellcheck "$f"
          done

      - name: bash syntax
        run: |
          for f in $(find . \( -name '*.sh' -o -path '*/scripts/*' \) -type f -not -path './.git/*'); do
            bash -n "$f"
          done

      - name: scan-forbidden (DOT-1, SEC-10)
        run: bash checks/scan-forbidden.sh

      - name: palette checks (DSN-A1, DSN-A2, DSN-TOK-3)
        run: python3 theme/gen/gen.py --check

      - name: palette regenerated (DOT-9)
        run: |
          python3 theme/gen/gen.py
          git diff --exit-code -- \
            'nvim/lua/colors.lua' 'foot/colors.ini' 'hypr/theme.lua' \
            'hypr/theme.conf' 'hypr/hyprpaper.conf' 'yazi/theme.toml' \
            'starship/starship.toml' 'starship/starship-lite.toml' \
            'waybar/theme-*.css' 'rofi/theme-*.rasi' 'swayosd/theme-*.css' \
            'hypr/effects-*.lua' 'mako/config-*' 'zathura/zathurarc' \
            'mpv/theme.conf' \
            'theme/export/glass-tide-*.tdesktop-theme' \
            || { echo 'сгенерированные файлы не соответствуют palette.toml — перегенерируйте и закоммитьте'; exit 1; }
