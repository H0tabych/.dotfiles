# Сгенерировано theme/gen/gen.py из theme/palette.toml (вариант forest, профиль ac) — не редактируйте
[mgr]
cwd = { fg = "#6CC6DD" }

hovered         = { reversed = true }
preview_hovered = { underline = true }

find_keyword  = { fg = "#F0B86E", italic = true }
find_position = { fg = "#B49AE8", bg = "reset", italic = true }

marker_copied   = { fg = "#B5DB86", bg = "#B5DB86" }
marker_cut      = { fg = "#F0817F", bg = "#F0817F" }
marker_marked   = { fg = "#7AAEEA", bg = "#7AAEEA" }
marker_selected = { fg = "#6CC6DD", bg = "#6CC6DD" }

# ПРОВЕРИТЬ: имена count_* — по аналогии с marker_* (DESIGN_SYSTEM.md P.3.5
# упоминает только группу "count_*", без точных имён), не подтверждено живым
# запуском.
count_copied   = { fg = "#0E1A22", bg = "#B5DB86" }
count_cut      = { fg = "#0E1A22", bg = "#F0817F" }
count_selected = { fg = "#0E1A22", bg = "#6CC6DD" }

border_symbol = "│"
border_style  = { fg = "#1F313D" }

[tabs]
active   = { fg = "#0E1A22", bg = "#6CC6DD" }
inactive = { fg = "#DCE7EC", bg = "#1F313D" }

[mode]
normal = { fg = "#0E1A22", bg = "#6CC6DD", bold = true }
select = { fg = "#0E1A22", bg = "#B5DB86", bold = true }
unset  = { fg = "#0E1A22", bg = "#B49AE8", bold = true }

[status]
separator_open  = ""
separator_close = ""

progress_label  = { fg = "#DCE7EC", bold = true }
progress_normal = { fg = "#6CC6DD", bg = "#1F313D" }
progress_error  = { fg = "#F0817F", bg = "#1F313D" }

permissions_t = { fg = "#7AAEEA" }
permissions_r = { fg = "#F0B86E" }
permissions_w = { fg = "#F0817F" }
permissions_x = { fg = "#B5DB86" }
permissions_s = { fg = "#1F313D" }

[input]
border   = { fg = "#6CC6DD" }
title    = {}
value    = {}
selected = { reversed = true }

[select]
border = { fg = "#6CC6DD" }
active = { fg = "#6CC6DD" }
inactive = {}

[tasks]
border  = { fg = "#6CC6DD" }
title   = {}
hovered = { underline = true }

[which]
mask            = { bg = "#0E1A22" }
cand            = { fg = "#6CCFCB" }
rest            = { fg = "#1F313D" }
desc            = { fg = "#6CC6DD" }
separator       = "  "
separator_style = { fg = "#1F313D" }

[help]
on      = { fg = "#6CCFCB" }
run     = { fg = "#6CC6DD" }
desc    = { fg = "#1F313D" }
hovered = { bg = "#1F313D", bold = true }
footer  = { fg = "#DCE7EC", bg = "#1F313D" }

# [cmp], [notify], [filetype], [icon] — секции упомянуты DESIGN_SYSTEM.md
# P.3.5 как существующие в 26.5.6, но схема их полей не подтверждена; не
# заданы — yazi применяет собственные умолчания. ПРОВЕРИТЬ на живой системе.
#
# [indicator] убран (был добавлен в R6.9, снят в тот же день): current с
# bg = surface2 рисовал тёмный полукруг поверх значка текущей строки —
# подтверждено пользователем на живой системе. Штатная подсветка текущей
# строки у yazi (светлая, mgr.hovered) и так работает без этой настройки.
