# Портативный конфиг yazi (DOT-3). Цвета — theme.toml (сгенерирован, DOT-9).

[manager]
ratio = [1, 3, 4]
sort_by = "natural"
sort_dir_first = true
show_hidden = false
show_symlink = true

[preview]
tab_size = 2
max_width = 600
max_height = 900

[opener]
edit = [
    { run = '$EDITOR "$@"', block = true, for = "unix" },
]
